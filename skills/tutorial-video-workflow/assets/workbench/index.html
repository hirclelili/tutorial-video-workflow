<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex 视频粗剪工作台</title>
  <link rel="stylesheet" href="/assets/styles.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">CX</span><div><p>VIDEO WORKBENCH</p><h1 id="projectTitle">视频粗剪工作台</h1></div></div>
    <div class="header-actions">
      <span id="saveState" class="status">正在载入…</span>
      <button id="undoBtn">撤销</button><button id="redoBtn">重做</button>
      <button id="exportBtn">导出审片</button><button id="jianyingBtn" class="primary">导出剪映工程</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="media-column panel">
      <div class="panel-head"><div><span class="kicker">MEDIA</span><h2>素材池</h2></div><span id="assetCount" class="count">0</span></div>
      <p class="panel-help">导入不等于使用。选择素材后再加入主时间线。</p>
      <div id="mediaBin" class="media-bin"></div>
      <div class="suggestion-head"><div><span class="kicker">AUTO ROUGH CUT</span><h2>粗剪建议</h2></div></div>
      <div id="suggestions" class="suggestions"></div>
    </aside>

    <section class="viewer-column">
      <section class="viewer-panel panel">
        <div class="viewer-wrap"><video id="player" controls playsinline></video><div id="emptyPlayer" class="empty">选择时间线片段开始预览</div></div>
        <div class="transport">
          <button id="prevClip">◀ 上一段</button><button id="splitBtn">⌘ 拆分</button><button id="nextClip">下一段 ▶</button>
          <span id="timeReadout">00:00.00 / 00:00.00</span>
        </div>
      </section>
    </section>

    <section class="transcript-panel panel">
      <div class="panel-head"><div><span class="kicker">TRANSCRIPT EDIT</span><h2>逐字精剪</h2></div><div class="compact-actions"><button id="selectAllBtn">选择当前段</button><button id="deleteWordsBtn" class="danger">删除</button><button id="restoreWordsBtn">恢复</button></div></div>
      <p class="panel-help">点击文字定位；Command/Control 多选，Shift 连选。</p>
      <div id="transcript" class="transcript"></div>
    </section>

    <section class="timeline-panel panel">
      <div class="timeline-toolbar">
        <div><span class="kicker">SEQUENCE</span><h2>主时间线</h2></div>
        <div class="timeline-controls"><span id="durationBadge">0 秒</span><label>缩放 <input id="zoomInput" type="range" min="8" max="48" value="20"></label></div>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>

    <aside class="inspector panel">
      <span class="kicker">INSPECTOR</span><h2 id="clipName">尚未选择</h2>
      <label>字幕文字</label><textarea id="captionText" rows="4" placeholder="选择字幕片段后修改"></textarea>
      <div class="two-cols"><label>音量<input id="volumeInput" type="number" min="0" max="2" step="0.05"></label><label>速度<input id="speedInput" type="number" min="0.25" max="4" step="0.05"></label></div>
      <button id="toggleClipBtn" class="danger full">移出主时间线</button><button id="confirmBtn" class="primary full">确认当前粗剪</button>
      <p class="hint">所有操作自动保存，原始素材保持只读。</p>
    </aside>
  </main>

  <div id="toast" class="toast"></div>
  <div id="exportDialog" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exportDialogTitle"><h2 id="exportDialogTitle">剪映工程导出</h2><p id="exportDialogText"></p><button id="closeDialog" class="primary">知道了</button></div></div>
  <script src="/assets/app.js?v=5"></script>
</body>
</html>
